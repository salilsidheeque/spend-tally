// Local, on-device storage shim standing in for Claude's window.storage API
window.storage = {
  get: async (key) => {
    const v = localStorage.getItem("spendtally:" + key);
    if (v === null) throw new Error("not found");
    return { key, value: v, shared: false };
  },
  set: async (key, value) => {
    localStorage.setItem("spendtally:" + key, value);
    return { key, value, shared: false };
  },
  delete: async (key) => {
    localStorage.removeItem("spendtally:" + key);
    return { key, deleted: true, shared: false };
  },
  list: async (prefix = "") => {
    const full = "spendtally:" + prefix;
    const keys = Object.keys(localStorage)
      .filter((k) => k.startsWith(full))
      .map((k) => k.slice("spendtally:".length));
    return { keys, prefix, shared: false };
  },
};

  { id: "shopping", name: "Shopping", color: "#6B7353", keywords: ["mall", "store", "boutique", "fashion", "shoes", "apparel"] },

];

function detectCategory(text) {
  if (!text) return "other";
  const lower = ` ${text.toLowerCase()} `;
  for (const cat of CATEGORIES) {
    if (cat.keywords.some((k) => lower.includes(k))) return cat.id;
  }
  return "other";
}

const NETWORKS = ["Visa", "Mastercard", "Amex", "Discover", "RuPay", "Other"];
const CARD_TYPES = [
  { id: "credit", name: "Credit card" },
  { id: "debit", name: "Debit card" },
];

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

// The billing cycle date in month (y, m) for a given statement day,
// clamped to the last day of the month for short months.
function cycleAnchor(y, m, statementDay) {
  const d = Math.min(statementDay, daysInMonth(y, m));
  return new Date(y, m, d);
}

// Billing cycle that ENDS (statement date) in month (y, m):
// runs from the day after the previous month's statement date
// through this month's statement date.
function cycleRange(y, m, statementDay) {
  const end = cycleAnchor(y, m, statementDay);
  const pm = m === 0 ? 11 : m - 1;
  const py = m === 0 ? y - 1 : y;
  const prevEnd = cycleAnchor(py, pm, statementDay);
  const start = new Date(prevEnd);
  start.setDate(start.getDate() + 1);
  return { start, end };
}

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

const MONTH_NAMES = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December",
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function formatAmount(n) {
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatDateDisplay(iso) {

  const dt = new Date(y, m - 1, d);

}

function stripBalanceNoise(text) {
  return text.replace(
    /(?:avl\.?\s*bal(?:ance)?|available\s*(?:limit|balance|bal)|avail\.?\s*bal|combined\s*avail\.?\s*bal|outstanding\s*balance|current\s*balance)[^.\n]{0,40}/gi,
    " "
  );
}

// ---- SMS parsing helpers ----
function extractAmount(text) {
  const cleaned = stripBalanceNoise(text);
  const patterns = [
    // 3-letter currency code, e.g. "AED 45.00", "USD 1,234.50"
    /\b[A-Z]{3}\s?([\d,]+\.\d{2})\b/,
    /(?:rs\.?|inr)\s?([\d,]+(?:\.\d{1,2})?)/i,
    /₹\s?([\d,]+(?:\.\d{1,2})?)/,
    /\$\s?([\d,]+(?:\.\d{1,2})?)/,
  ];
  for (const p of patterns) {
    const m = cleaned.match(p);
    if (m) return parseFloat(m[1].replace(/,/g, ""));
  }
  return null;
}

function extractMerchant(text) {
  // "... from MERCHANT on 29/08" style
  let m = text.match(/\bfrom\s+([A-Za0-9&'.,\-\s]{3,40}?)\s+on\s+\d/i);
  if (m) return m[1].trim();
  // "... at MERCHANT ..." style
  m = text.match(/\bat\s+([A-Za0-9&'.,\-\s]{3,40}?)(?:\son\b|[.,]|$)/i);
  if (m) return m[1].trim();
  // line-based SMS: pick the line that looks like a merchant name, not metadata
  const skip = /card|purchase|avl|bal|available|balance|instal|interest|condition|apply|otp|debit|credit|combined/i;
  const lines = text.split(/\n+/).map((l) => l.trim()).filter(Boolean);
  for (const line of lines) {
    if (skip.test(line)) continue;
    if (/^\d/.test(line)) continue;
    const digitRatio = (line.match(/\d/g) || []).length / line.length;
    if (digitRatio > 0.3) continue;
    if (line.length > 3) return line;
  }
  return null;
}

function extractCardLast4(text) {
  const idx = text.toLowerCase().indexOf("card");
  if (idx === -1) return null;
  const window = text.slice(idx, idx + 45);
  let m = window.match(/[x*]{2,}\s*(\d{4})\b/i);
  if (m) return m[1];
  m = window.match(/(?:no\.?|number|ending)[:\s]*(\d{4})\b/i);
  if (m) return m[1];
  m = window.match(/(\d{4})\b(?!\d)/);
  if (m) return m[1];
  return null;
}

function extractDate(text) {
  // dd/mm/yy(yy) or dd-mm-yy(yy)
  let m = text.match(/(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = "20" + y;
    if (Number(mo) <= 12) {
      return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }
  }
  // dd Mon yy(yy)
  const monMap = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
  m = text.match(/(\d{1,2})[\s-]?([A-Za-z]{3,})[\s-]?(\d{2,4})?/);
  if (m) {
    const monKey = m[2].slice(0, 3).toLowerCase();
    if (monMap[monKey]) {
      const d = m[1];
      let y = m[3] || new Date().getFullYear();
      if (String(y).length === 2) y = "20" + y;
      return `${y}-${String(monMap[monKey]).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }
  }
  // dd/mm with no year at all, e.g. "on 29/08."
  m = text.match(/\b(\d{1,2})[-/](\d{1,2})\b/);
  if (m) {
    const [, d, mo] = m;
    if (Number(mo) <= 12 && Number(d) <= 31) {
      const y = new Date().getFullYear();
      return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }
  }
  return todayISO();
}

function splitMessages(raw) {
  let blocks = raw.split(/\n\s*\n+/).map((b) => b.trim()).filter(Boolean);
  if (blocks.length > 1) return blocks;

  // No blank lines to go on — group lines heuristically so a single
  // multi-line SMS isn't shredded into one "message" per line.
  const lines = raw.split(/\n+/).map((l) => l.trim()).filter(Boolean);
  if (lines.length <= 1) return lines;

  const headerPattern = /^(credit card purchase|debit card purchase|card purchase|purchase alert|transaction alert)/i;
  const singleLinePattern = /^[A-Z]{3}\s?[\d,]+\.\d{2}\s+(is charged|has been charged|was charged|spent|debited)/i;

  const groups = [];
  let current = [];
  for (const line of lines) {
    const isNewMsgStart = headerPattern.test(line) || singleLinePattern.test(line);
    if (isNewMsgStart && current.length > 0) {
      groups.push(current.join("\n"));
      current = [line];
    } else {
      current.push(line);
    }
  }
  if (current.length) groups.push(current.join("\n"));
  return groups.length ? groups : [raw.trim()];
}

function parseSms(raw, banks) {
  const messages = splitMessages(raw);
  const results = [];
  for (const msg of messages) {
    const amount = extractAmount(msg);
    if (amount === null) continue;
    const cardLast4 = extractCardLast4(msg);
    let matchedBank = null;
    if (cardLast4) {
      matchedBank = banks.find((b) => (b.cardLast4 || []).includes(cardLast4)) || null;
    }
    if (!matchedBank) {
      for (const bank of banks) {
        const kws = (bank.keywords || []).filter(Boolean);
        if (kws.some((k) => msg.toLowerCase().includes(k.toLowerCase()))) {
          matchedBank = bank;
          break;
        }
      }
    }
    const merchant = extractMerchant(msg);
    results.push({
      tempId: uid(),
      date: extractDate(msg),
      amount,
      bankId: matchedBank ? matchedBank.id : null,
      categoryId: detectCategory(`${merchant || ""} ${msg}`),
      description: merchant || (msg.length > 60 ? msg.slice(0, 60) + "…" : msg),
      raw: msg,
      include: true,
    });
  }
  return results;
}

function ExpenseTracker() {
  const [loading, setLoading] = useState(true);
  const [banks, setBanks] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [tab, setTab] = useState("summary");
  const [monthCursor, setMonthCursor] = useState(() => {
    const d = new Date();
    return { y: d.getFullYear(), m: d.getMonth() };
  });

  // manual add form
  const [form, setForm] = useState({ date: todayISO(), amount: "", bankId: "", categoryId: "other", description: "" });
  const [newBankName, setNewBankName] = useState("");

  // bank/card form
  const [bankForm, setBankForm] = useState({ name: "", cardLast4: "", keywords: "", cardType: "credit", network: "Visa", statementDay: "" });

  // sms
  const [smsText, setSmsText] = useState("");
  const [smsPreview, setSmsPreview] = useState([]);

  useEffect(() => {
    (async () => {
      try {
        const b = await window.storage.get("banks").catch(() => null);
        const e = await window.storage.get("expenses").catch(() => null);
        setBanks(b ? JSON.parse(b.value) : []);
        setExpenses(e ? JSON.parse(e.value) : []);
      } catch (err) {
        console.error("load error", err);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  async function persistBanks(next) {
    setBanks(next);
    try {
      await window.storage.set("banks", JSON.stringify(next));
    } catch (err) {
      console.error("save banks failed", err);
    }
  }

  async function persistExpenses(next) {
    setExpenses(next);
    try {
      await window.storage.set("expenses", JSON.stringify(next));
    } catch (err) {
      console.error("save expenses failed", err);
    }
  }

  function createBank(opts) {
    const { name, cardLast4 = [], keywords = [], cardType = "credit", network = "Other", statementDay = null } = opts;
    const color = PALETTE[banks.length % PALETTE.length];
    const bank = { id: uid(), name: name.trim(), cardLast4, keywords, cardType, network, statementDay, color };
    const next = [...banks, bank];
    persistBanks(next);
    return bank;
  }

  function addBank() {
    if (!bankForm.name.trim()) return;
    createBank({
      name: bankForm.name,
      cardLast4: bankForm.cardLast4.split(",").map((k) => k.trim()).filter(Boolean),
      keywords: bankForm.keywords.split(",").map((k) => k.trim()).filter(Boolean),
      cardType: bankForm.cardType,
      network: bankForm.network,
      statementDay: bankForm.statementDay ? Number(bankForm.statementDay) : null,
    });
    setBankForm({ name: "", cardLast4: "", keywords: "", cardType: "credit", network: "Visa", statementDay: "" });
  }

  function removeBank(id) {
    persistBanks(banks.filter((b) => b.id !== id));
  }

  function addExpenseManual() {
    if (!form.amount || isNaN(parseFloat(form.amount))) return;
    let bankId = form.bankId || null;
    if (bankId === "__new__") {
      if (!newBankName.trim()) return;
      const bank = createBank({ name: newBankName });
      bankId = bank.id;
    }
    const next = [
      ...expenses,
      {
        id: uid(),
        date: form.date,
        amount: parseFloat(form.amount),
        bankId,
        categoryId: form.categoryId || "other",
        description: form.description.trim() || "Expense",
        source: "manual",
      },
    ];
    persistExpenses(next);
    setForm({ date: todayISO(), amount: "", bankId: "", categoryId: "other", description: "" });
    setNewBankName("");
    setTab("summary");
  }

  function removeExpense(id) {
    persistExpenses(expenses.filter((e) => e.id !== id));
  }

  const [confirmTarget, setConfirmTarget] = useState(null); // { kind: 'expense'|'card', id, label }

  function requestDeleteExpense(id, label) {
    setConfirmTarget({ kind: "expense", id, label: label || "this expense" });
  }

  function requestDeleteCard(id, label) {
    setConfirmTarget({ kind: "card", id, label: label || "this card" });
  }

  function cancelDelete() {
    setConfirmTarget(null);
  }

  function confirmDelete() {
    if (!confirmTarget) return;
    if (confirmTarget.kind === "expense") removeExpense(confirmTarget.id);
    if (confirmTarget.kind === "card") removeBank(confirmTarget.id);
    setConfirmTarget(null);
  }

  function runSmsParse() {
    const parsed = parseSms(smsText, banks);
    setSmsPreview(parsed);
  }

  function togglePreview(tempId) {
    setSmsPreview((prev) => prev.map((p) => (p.tempId === tempId ? { ...p, include: !p.include } : p)));
  }

  function updatePreviewBank(tempId, bankId) {
    setSmsPreview((prev) => prev.map((p) => (p.tempId === tempId ? { ...p, bankId } : p)));
  }

  function updatePreviewCategory(tempId, categoryId) {
    setSmsPreview((prev) => prev.map((p) => (p.tempId === tempId ? { ...p, categoryId } : p)));
  }

  function confirmSmsImport() {
    const toAdd = smsPreview
      .filter((p) => p.include)
      .map((p) => ({
        id: uid(),
        date: p.date,
        amount: p.amount,
        bankId: p.bankId,
        categoryId: p.categoryId || "other",
        description: p.description,
        source: "sms",
      }));
    persistExpenses([...expenses, ...toAdd]);
    setSmsPreview([]);
    setSmsText("");
    setTab("summary");
  }

  const monthExpenses = useMemo(() => {
    return expenses.filter((e) => {
      const [y, m] = e.date.split("-").map(Number);
      return y === monthCursor.y && m - 1 === monthCursor.m;
    });
  }, [expenses, monthCursor]);

  const monthTotal = monthExpenses.reduce((s, e) => s + e.amount, 0);

  const byBank = useMemo(() => {
    const map = {};
    for (const e of monthExpenses) {
      const key = e.bankId || "unassigned";
      map[key] = (map[key] || 0) + e.amount;
    }
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [monthExpenses]);

  const byCategory = useMemo(() => {
    const map = {};
    for (const e of monthExpenses) {
      const key = e.categoryId || "other";
      map[key] = (map[key] || 0) + e.amount;
    }
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [monthExpenses]);

  function bankById(id) {
    return banks.find((b) => b.id === id);
  }

  function categoryById(id) {
    return CATEGORIES.find((c) => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
  }

  function shiftMonth(delta) {
    setMonthCursor((prev) => {
      let m = prev.m + delta;
      let y = prev.y;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      return { y, m };
    });
  }

  const sortedTransactions = useMemo(
    () => [...expenses].sort((a, b) => (a.date < b.date ? 1 : -1)),
    [expenses]
  );

  if (loading) {
    return (
      <div style={styles.loadingWrap}>
        <style>{globalCss}</style>
        <div style={{ color: "#6B7353", fontFamily: "Georgia, serif" }}>Opening Spend Tally…</div>
      </div>
    );
  }

  return (
    <div className="olv-app" style={styles.shell}>
      <style>{globalCss}</style>

      <div style={styles.topBar}>
        <div style={styles.topBarInner}>
          <TallyMark size={22} strokeColor="#F3EEE1" accentColor="#C9B872" />
          <span style={styles.brand}>Spend Tally</span>
        </div>
      </div>

      <div style={styles.content}>
        {tab === "summary" && (
          <Summary
            monthCursor={monthCursor}
            shiftMonth={shiftMonth}
            monthTotal={monthTotal}
            byBank={byBank}
            byCategory={byCategory}
            bankById={bankById}
            categoryById={categoryById}
            monthExpenses={monthExpenses}
            removeExpense={requestDeleteExpense}
          />
        )}

        {tab === "transactions" && (
          <Transactions transactions={sortedTransactions} bankById={bankById} categoryById={categoryById} removeExpense={requestDeleteExpense} />
        )}

        {tab === "add" && (
          <AddExpense
            form={form}
            setForm={setForm}
            banks={banks}
            newBankName={newBankName}
            setNewBankName={setNewBankName}
            onSubmit={addExpenseManual}
          />
        )}

        {tab === "sms" && (
          <SmsImport
            smsText={smsText}
            setSmsText={setSmsText}
            runSmsParse={runSmsParse}
            smsPreview={smsPreview}
            banks={banks}
            togglePreview={togglePreview}
            updatePreviewBank={updatePreviewBank}
            updatePreviewCategory={updatePreviewCategory}
            confirmSmsImport={confirmSmsImport}
          />
        )}

        {tab === "banks" && (
          <Banks bankForm={bankForm} setBankForm={setBankForm} addBank={addBank} banks={banks} removeBank={requestDeleteCard} onDeleteExpense={requestDeleteExpense} expenses={expenses} categoryById={categoryById} />
        )}
      </div>

      {confirmTarget && (
        <ConfirmDialog
          message={confirmTarget.kind === "card"
            ? `Delete "${confirmTarget.label}"? Its saved keywords and card digits will be removed. Expenses already recorded against it will stay, just unassigned.`
            : `Delete this expense — ${confirmTarget.label}? This can't be undone.`}
          onCancel={cancelDelete}
          onConfirm={confirmDelete}
        />
      )}

      <div style={styles.tabBar}>
        <TabBtn icon={<Home size={18} />} label="Summary" active={tab === "summary"} onClick={() => setTab("summary")} />
        <TabBtn icon={<ListChecks size={18} />} label="History" active={tab === "transactions"} onClick={() => setTab("transactions")} />
        <TabBtn icon={<Plus size={18} />} label="Add" active={tab === "add"} onClick={() => setTab("add")} accent />
        <TabBtn icon={<Inbox size={18} />} label="SMS" active={tab === "sms"} onClick={() => setTab("sms")} />
        <TabBtn icon={<Landmark size={18} />} label="Banks" active={tab === "banks"} onClick={() => setTab("banks")} />
      </div>
    </div>
  );
}

function Banks({ bankForm, setBankForm, addBank, banks, removeBank, onDeleteExpense, expenses, categoryById }) {
  const [view, setView] = useState("list"); // list | add | detail
  const [selectedId, setSelectedId] = useState(null);
  const [cycleOffset, setCycleOffset] = useState(0);

  function openCard(id) {
    setSelectedId(id);
    setCycleOffset(0);
    setView("detail");
  }

  function handleAdd() {
    addBank();
    setView("list");
  }

  if (view === "add") {
    return (
      <CardForm
        bankForm={bankForm}
        setBankForm={setBankForm}
        onSubmit={handleAdd}
        onCancel={() => setView("list")}
      />
    );
  }

  if (view === "detail") {
    const card = banks.find((b) => b.id === selectedId);
    if (!card) { setView("list"); return null; }
    return (
      <CardDetail
        card={card}
        expenses={expenses}
        categoryById={categoryById}
        cycleOffset={cycleOffset}
        setCycleOffset={setCycleOffset}
        onBack={() => setView("list")}
        onDeleteExpense={onDeleteExpense}
      />
    );
  }

  return (
    <div>
      <button style={styles.addCardBtn} onClick={() => setView("add")}>
        <Plus size={16} /> Add new card
      </button>

      <div style={styles.card}>
        <div style={styles.cardTitle}>Your cards</div>
        {banks.length === 0 && <div style={styles.emptyText}>No cards added yet.</div>}
        {banks.map((b) => (
          <div key={b.id} style={styles.cardListRow} onClick={() => openCard(b.id)}>
            <span style={{ ...styles.bankDot, background: b.color }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={styles.bankName}>{b.name}</div>
              <div style={styles.bankKeywords}>
                {(b.cardLast4 || []).length > 0 ? `•• ${(b.cardLast4 || []).join(", ")}` : "no card digits set"}
                {" · "}{CARD_TYPES.find((t) => t.id === b.cardType)?.name || "Credit card"}
                {" · "}{b.network || "Other"}
                {b.statementDay ? ` · Statement: ${b.statementDay}${ordinalSuffix(b.statementDay)}` : ""}
              </div>
            </div>
            <button style={styles.deleteBtn} onClick={(e) => { e.stopPropagation(); removeBank(b.id, b.name); }}><Trash2 size={14} /></button>
            <ChevronRight size={16} color="#B7ACA0" />
          </div>
        ))}
      </div>
    </div>
  );
}

function ordinalSuffix(n) {
  const v = n % 100;
  if (v >= 11 && v <= 13) return "th";
  switch (n % 10) {
    case 1: return "st";
    case 2: return "nd";
    case 3: return "rd";
    default: return "th";
  }
}

function CardDetail({ card, expenses, categoryById, cycleOffset, setCycleOffset, onBack, onDeleteExpense }) {
  const hasCycle = !!card.statementDay;

  const now = new Date();
  let cycleLabel = "";
  let cycleExpenses = [];
  let cycleTotal = 0;

  if (hasCycle) {
    let y = now.getFullYear();
    let m = now.getMonth() + cycleOffset;
    while (m < 0) { m += 12; y -= 1; }
    while (m > 11) { m -= 12; y += 1; }
    const { start, end } = cycleRange(y, m, card.statementDay);
    const startISO = toISO(start);
    const endISO = toISO(end);
    cycleLabel = `${start.getDate()} ${MONTH_NAMES[start.getMonth()].slice(0, 3)} – ${end.getDate()} ${MONTH_NAMES[end.getMonth()].slice(0, 3)} ${end.getFullYear()}`;
    cycleExpenses = expenses.filter((e) => e.bankId === card.id && e.date >= startISO && e.date <= endISO);
    cycleTotal = cycleExpenses.reduce((s, e) => s + e.amount, 0);
  } else {
    cycleExpenses = expenses.filter((e) => e.bankId === card.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    cycleTotal = cycleExpenses.reduce((s, e) => s + e.amount, 0);
  }

  return (
    <div>
      <div style={styles.detailHeader}>
        <button style={styles.navArrow} onClick={onBack}><ChevronLeft size={18} /></button>
        <div>
          <div style={styles.detailTitle}>{card.name}</div>
          <div style={styles.bankKeywords}>
            {(card.cardLast4 || []).length > 0 ? `•• ${(card.cardLast4 || []).join(", ")}` : ""}
            {" · "}{CARD_TYPES.find((t) => t.id === card.cardType)?.name || "Credit card"}
            {" · "}{card.network || "Other"}
          </div>
        </div>
      </div>

      {!hasCycle && (
        <div style={styles.warnText}>No statement date set for this card, so this shows all-time totals instead of billing cycles. Delete and re-add the card with a statement date to see it month-wise.</div>
      )}

      {hasCycle && (
        <div style={styles.monthNav}>
          <button style={styles.navArrow} onClick={() => setCycleOffset(cycleOffset - 1)}><ChevronLeft size={18} /></button>
          <span style={styles.monthLabel}>{cycleLabel}</span>
          <button style={styles.navArrow} onClick={() => setCycleOffset(cycleOffset + 1)}><ChevronRight size={18} /></button>
        </div>
      )}

      <div style={styles.stampCard}>
        <div style={{ ...styles.stampBadge, borderColor: card.color }}>
          <span style={styles.stampCurrency}>{hasCycle ? "Cycle total" : "Total"}</span>
          <span style={styles.stampAmount}>{formatAmount(cycleTotal)}</span>
          <span style={styles.stampSub}>{cycleExpenses.length} entries</span>
        </div>
      </div>

      <div style={styles.card}>
        <div style={styles.cardTitle}>Transactions</div>
        {cycleExpenses.length === 0 && <div style={styles.emptyText}>No spends recorded {hasCycle ? "in this cycle" : "on this card"} yet.</div>}
        {cycleExpenses
          .slice()
          .sort((a, b) => (a.date < b.date ? 1 : -1))
          .map((e) => (
            <LedgerRow key={e.id} expense={e} bank={null} category={categoryById(e.categoryId)} onDelete={() => onDeleteExpense(e.id, e.description)} />
          ))}
      </div>
    </div>
  );
}
